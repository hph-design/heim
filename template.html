<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Heim.fo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>body{margin:0}img{max-width:100%}
/* Layout: black club-style header, radial green hero with search, card grid; hash-routed views (forsida / ognir / ogn-id / meklarar) */
:root{
  --bg:#F2F5F2; --surface:#FFFFFF; --ink:#161717; --muted:#58635D; --line:#DAE1DC;
  --green:#369A68; --green-ink:#23704A; --green-soft:#E3F1E9; --red:#D92128; --red-soft:#FBE4E5;
  --amber:#B7791F; --amber-soft:#FBF0DC;
  --head:#161717; --head-fg:#FFFFFF; --head-muted:#A9B3AD;
  --hero-1:#4FBF87; --hero-2:#2A7F55; --hero-3:#161717;
  --shadow:0 1px 2px rgba(22,23,23,.06),0 6px 18px rgba(22,23,23,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}



*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
a{color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* demo strip + header */
.demo{background:var(--red);color:#fff;font-size:13px;font-weight:600;letter-spacing:.04em;text-align:center}
.demo .wrap{padding-block:6px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--head);color:var(--head-fg);border-bottom:4px solid var(--green)}
header.top .wrap{display:flex;align-items:center;gap:24px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.logo svg{flex:none}
.logo b{color:var(--green)}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.05em;color:var(--head-muted);padding:6px 12px;border-radius:6px}
nav.main a:hover{color:var(--head-fg)}
nav.main a[aria-current="page"]{color:var(--head-fg);background:rgba(255,255,255,.08);box-shadow:inset 0 -3px 0 var(--green)}

/* hero */
.hero{background:radial-gradient(120% 140% at 85% 0%,var(--hero-1) 0%,var(--hero-2) 38%,var(--hero-3) 82%);color:#fff;overflow:hidden;position:relative}
.hero .wrap{padding-block:56px 40px;position:relative}
.hero .kicker{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:#BFE8D2}
.hero h1{font-size:clamp(44px,8vw,92px);font-weight:800;margin-top:10px;max-width:12ch}
.hero h1 span{color:#BFE8D2}
.hero p.lead{max-width:56ch;font-size:18px;color:#E3EFE8;margin:18px 0 0}
.hero .stripes{position:absolute;right:-60px;bottom:-40px;width:420px;height:420px;opacity:.12;pointer-events:none}

.search{margin-top:28px;background:var(--surface);color:var(--ink);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:2fr 1.2fr 1.2fr 1.2fr auto;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.field select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;min-width:0;width:100%}
.btn{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.06em;border:0;border-radius:7px;padding:10px 22px;cursor:pointer;background:var(--green);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--green-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink);background:transparent}
.search .btn{align-self:end;height:42px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.18);margin-top:28px;border-radius:var(--r);overflow:hidden}
.stats div{background:rgba(10,12,11,.45);padding:14px 18px}
.stats b{display:block;font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1}
.stats span{font-size:13px;color:#C9DDD1;text-transform:uppercase;letter-spacing:.08em}

/* sections */
section.block{padding-block:44px 8px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(30px,4vw,42px);font-weight:800;position:relative;padding-left:16px}
.sec-head h2::before{content:"";position:absolute;left:0;top:2px;bottom:4px;width:6px;background:var(--green);border-radius:2px}
.sec-head a{font-weight:600;color:var(--green-ink);text-decoration:none}
.sec-head a:hover{text-decoration:underline}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(22,23,23,.08),0 14px 28px rgba(22,23,23,.12)}
.card .pic{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--green-soft)}
.card .pic svg{display:block;width:100%;height:100%}
.chips{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--surface);color:var(--ink);line-height:1.3}
.chip.new{background:var(--green);color:#fff}
.chip.bid{background:var(--red);color:#fff}
.chip.price{background:var(--amber);color:#fff}
.chip.sold{background:#161717;color:#fff}
.chip.open{background:var(--surface);color:var(--green-ink);box-shadow:inset 0 0 0 2px var(--green)}
.card .body{padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .addr{font-weight:600;font-size:17px;line-height:1.25}
.card .town{color:var(--muted);font-size:14px}
.card .price{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;margin-top:4px}
.card .bidline{font-size:13px;color:var(--red);font-weight:600}
.facts{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:auto;padding-top:8px}
.facts b{color:var(--ink);font-weight:600}
.card .src{border-top:1px solid var(--line);padding:9px 16px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.card .src strong{color:var(--ink);font-weight:600}

/* list view */
.page-head{padding-block:36px 8px}
.page-head h1{font-size:clamp(40px,6vw,64px);font-weight:800}
.page-head p{color:var(--muted);margin:8px 0 0;max-width:60ch}
.listing{display:grid;grid-template-columns:260px 1fr;gap:28px;padding-block:20px 48px;align-items:start}
.filters{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px)}
.filters h3{font-size:22px;font-weight:800}
.agentlist{display:flex;flex-direction:column;gap:6px}
.agentlist label{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.agentlist input{accent-color:var(--green);width:17px;height:17px}
.agentlist .cnt{margin-left:auto;color:var(--muted);font-size:13px}
.results-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.results-bar .count{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.results-bar .field{flex-direction:row;align-items:center;gap:8px}
.results-bar select{width:auto}
.empty{background:var(--surface);border-radius:var(--r);padding:40px 24px;text-align:center;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--green-ink);font:inherit;font-weight:600;cursor:pointer;padding:0;text-align:left}
.linkbtn:hover{text-decoration:underline}

/* detail */
.back{display:inline-block;margin-top:24px;color:var(--green-ink);font-weight:600;text-decoration:none}
.back:hover{text-decoration:underline}
.detail{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;padding-block:16px 40px;align-items:start}
.detail .hero-pic{border-radius:var(--r);overflow:hidden;aspect-ratio:16/10;max-width:100%;position:relative;box-shadow:var(--shadow)}
.detail .hero-pic svg{display:block;width:100%;height:100%}
.detail h1{font-size:clamp(36px,5vw,56px);font-weight:800;margin-top:20px}
.detail .town{color:var(--muted);font-size:18px;margin-top:6px}
.factgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;margin-top:22px}
.factgrid div{background:var(--surface);padding:14px 16px}
.factgrid span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.factgrid b{font-family:var(--f-display);font-size:26px;font-weight:700}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px)}
.pricebox{background:var(--head);color:var(--head-fg);border-radius:var(--r);padding:20px;border-top:5px solid var(--green)}
.pricebox .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--head-muted);font-weight:600}
.pricebox .big{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1.05}
.pricebox .bid{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15)}
.pricebox .bid b{font-family:var(--f-display);font-size:28px;color:#FF7A7F}
.pricebox .bid small{display:block;color:var(--head-muted);font-size:14px}
.pricebox .open{margin-top:14px;padding:10px 12px;background:rgba(75,182,128,.16);border-radius:7px;font-size:15px}
.agentbox{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.agentbox .who{display:flex;align-items:center;gap:12px}
.mono{width:46px;height:46px;border-radius:8px;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;flex:none}
.agentbox .who b{display:block;font-size:17px}
.agentbox .who span{font-size:14px;color:var(--muted)}
.agentbox p{margin:0;font-size:14px;color:var(--muted)}
.agentbox .btn{width:100%}

/* pitch */
.pitch-hero .wrap{padding-block:56px 48px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{background:var(--surface);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.step .n{font-family:var(--f-display);font-weight:800;font-size:48px;color:var(--green);line-height:1}
.step h3{font-size:24px;font-weight:800;margin-top:8px}
.step p{color:var(--muted);margin:8px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.checks li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);padding:14px 16px;border-radius:var(--r)}
.checks li svg{flex:none;margin-top:2px}
.checks b{display:block}
.checks span{color:var(--muted);font-size:15px}
.code{background:var(--head);color:#DDE7E1;border-radius:var(--r);padding:18px;overflow-x:auto;font:13px/1.6 ui-monospace,"Cascadia Mono",Consolas,monospace;margin:0}
.code .k{color:#7FD3A6}.code .s{color:#FFB3B6}.code .c{color:#7E8A84}
.contact{background:var(--green);color:#fff;border-radius:var(--r);padding:28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-block:44px 56px}
.contact h2{font-size:clamp(28px,4vw,40px);font-weight:800}
.contact p{margin:6px 0 0;color:#E3F4EA}
.contact .who{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em}

footer{background:var(--head);color:var(--head-muted);font-size:14px;margin-top:40px}
footer .wrap{padding-block:26px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer b{color:var(--head-fg);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;font-size:18px}

@media (max-width:900px){
  .search{grid-template-columns:1fr 1fr}
  .search .field:first-child{grid-column:1/-1}
  .search .btn{grid-column:1/-1}
  .listing,.detail,.two{grid-template-columns:1fr}
  .filters,.side{position:static}
  .steps{grid-template-columns:1fr}
}
@media (max-width:520px){
  .stats b{font-size:26px}
  .stats div{padding:12px}
  .factgrid{grid-template-columns:repeat(2,1fr)}
  header.top .wrap{gap:8px}
  nav.main{margin-left:0;width:100%}
  nav.main a{font-size:15px;padding:4px 8px}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}

.card .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.card .pic .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em;background:repeating-linear-gradient(135deg,var(--green-soft) 0 12px,var(--surface) 12px 24px)}
.card .chips{z-index:2}
.card.is-sold .pic img{filter:grayscale(.85);opacity:.8}
.card .bidline.muted{color:var(--muted);font-weight:500}
.noprice{font-size:20px;color:var(--muted)}
.card .src{color:var(--green-ink);font-weight:600}
.card .src strong{color:inherit}
.card:hover .src{background:var(--green-soft)}
.ext{font-size:16px}
.card .price{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sqm{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}

.areastat{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:var(--head);color:var(--head-fg);border-radius:var(--r);border-left:6px solid var(--green);padding:18px 22px;margin-bottom:18px}
.areastat .lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--head-muted);font-weight:600}
.areastat b{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1.05}
.areastat small{display:block;color:var(--head-muted);font-size:13px}
.areastat .cmp{display:flex;align-items:center;gap:10px}
.areastat .cmp b{font-size:30px}
.areastat .cmp.up b{color:#FF7A7F}.areastat .cmp.down b{color:#7FD3A6}
.areastat .cmp span{font-size:13px;color:var(--head-muted);line-height:1.35}

.monthly{font-size:13px;color:var(--muted);font-weight:500}
.loanhint{margin:0 0 14px;font-size:14px;color:var(--muted)}
.loanhint a{color:var(--green-ink);font-weight:600}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;padding-block:20px 48px;align-items:start}
.calcform{position:static}
.calcform small{font-size:13px;color:var(--muted)}
.calcform input[type=range]{accent-color:var(--green);width:100%}
.unit{display:flex;align-items:center;gap:8px}
.unit input{flex:1;font-size:18px!important;font-weight:600;font-variant-numeric:tabular-nums}
.unit span{color:var(--muted)}
.calcout{display:flex;flex-direction:column;gap:14px;min-width:0}
.calcout .pricebox .big{font-size:52px}
.calcout .sub{color:var(--head-muted);font-size:14px;margin-top:6px}
.rows{margin:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.rows div:last-child{border-bottom:0}
.rows dt{color:var(--muted)}.rows dd{margin:0;font-weight:600}
.rows .tot{background:var(--green-soft)}.rows .tot dt,.rows .tot dd{color:var(--ink);font-weight:700}
.warn{margin:0;padding:12px 16px;border-radius:var(--r);background:var(--amber-soft);color:var(--ink);font-size:14px}
.note{margin:0;font-size:13px;color:var(--muted)}
@media (max-width:900px){.calc{grid-template-columns:1fr}}

/* ---- Lysere udgave ---- */
:root{--bg:#F6F9F7;--head:#FFFFFF;--head-fg:#161717;--head-muted:#5B6560;--soft2:#EAF5EF;color-scheme:light}
body::before{background:#FFFFFF}
header.top{border-bottom:3px solid var(--green);box-shadow:0 1px 0 var(--line)}
nav.main a{color:#5B6560}
nav.main a:hover{color:#161717}
nav.main a[aria-current="page"]{background:var(--green-soft);color:var(--green-ink);box-shadow:none}
.logo svg path:nth-of-type(2){stroke:#161717}
.demo{background:var(--green-soft)!important;color:var(--green-ink)}
.hero{background:linear-gradient(160deg,#E6F4EC 0%,#F6F9F7 70%);color:var(--ink)}
.hero .kicker{color:var(--green-ink)}
.hero h1 span{color:var(--green)}
.hero p.lead{color:#3E4843}
.hero .stripes{opacity:.08}
.hero .stripes path{stroke:var(--green)}
.search{box-shadow:0 8px 24px rgba(35,112,74,.12);border:1px solid var(--line)}
.stats{background:var(--line)}
.stats div{background:#FFFFFF}
.stats b{color:var(--green-ink)}
.stats span{color:var(--muted)}
.pricebox{background:#FFFFFF;color:var(--ink);box-shadow:var(--shadow);border-top-color:var(--green)}
.pricebox .lbl,.calcout .sub{color:var(--muted)}
.pricebox .big{color:var(--green-ink)}
.areastat{background:#FFFFFF;color:var(--ink);box-shadow:var(--shadow)}
.areastat .lbl,.areastat small,.areastat .cmp span{color:var(--muted)}
.areastat b{color:var(--green-ink)}
.areastat .cmp.up b{color:var(--red)}.areastat .cmp.down b{color:var(--green)}
footer{background:#EAF2ED;color:var(--muted)}
footer b{color:var(--ink)}

/* ---- Orange ---- */
:root{--green:#D9661F;--green-ink:#A3470C;--green-soft:#FCEDE1;--bg:#FBF8F5;--amber:#3E4A5C}
.hero{background:linear-gradient(160deg,#FBE3CF 0%,#FBF8F5 70%)}
.search{box-shadow:0 8px 24px rgba(163,71,12,.12)}
footer{background:#F6ECE3}

.srcl{display:flex;align-items:center;gap:8px}
.alogo{height:20px;width:auto;max-width:90px;display:block;color:#161717}
.flogo{height:18px;width:auto;max-width:90px;display:block}
.agentlist label{min-height:28px}
.agents{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.agentcard{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.agentcard:hover{border-color:var(--green);transform:translateY(-2px)}
.blogo{height:38px;width:auto;max-width:150px;display:block}
.agentcard span{font-size:15px;color:var(--muted)}
.agentcard b{color:var(--ink);font-size:18px}
.agentcard .go{color:var(--green-ink);font-weight:600;font-size:14px}
@media (max-width:900px){.agents{grid-template-columns:repeat(2,minmax(0,1fr))}}

.age{font-size:13px;color:var(--muted)}
.chip.today{background:var(--green);color:#fff}
.bidline.down{color:#1E7A4C}.bidline.up{color:var(--red)}

/* friskleiki */
.card.fresh0{box-shadow:0 0 0 3px var(--green),0 10px 26px rgba(163,71,12,.18)}
.card.fresh1{box-shadow:0 0 0 2px var(--green),var(--shadow)}
.card.hasbid{box-shadow:0 0 0 3px var(--red),0 10px 26px rgba(217,33,40,.16)}
.chip.today.soft{background:var(--green-soft);color:var(--green-ink)}
.chip.visit{background:var(--ink);color:#fff}
.chip.bidnew{background:var(--red);color:#fff;animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.08)}}
.was{color:var(--muted);font-weight:500}
.grid.featured>.card:first-child{grid-column:span 2}
.grid.featured>.card:first-child .pic{aspect-ratio:16/8}
.grid.featured>.card:first-child .price{font-size:34px}
@media (max-width:620px){.grid.featured>.card:first-child{grid-column:auto}.grid.featured>.card:first-child .pic{aspect-ratio:16/10}}
.alerts{display:flex;gap:12px;flex-wrap:wrap;padding-top:28px}
.alert{font:inherit;font-size:16px;font-weight:600;border:0;border-radius:var(--r);padding:12px 18px;cursor:pointer;background:var(--ink);color:#fff}
.alert b{font-family:var(--f-display);font-size:22px;margin-right:4px}
.alert.bid{background:var(--red)}
.alert:hover{opacity:.9}
@media (prefers-reduced-motion:reduce){.chip.bidnew{animation:none}}

/* kompakt hero, so tað nýggjasta sæst skjótt */
.hero .wrap{padding-block:32px 28px}
.hero h1{font-size:clamp(34px,5vw,58px);max-width:none}
.hero p.lead{margin-top:10px;font-size:17px}
.search{margin-top:20px}
.stats{margin-top:18px}
.stats b{font-size:28px}
.alerts{padding-top:22px}
</style>
</head>
<body>
<div class="demo" style="background:var(--green-ink)"><div class="wrap">Persónligt yvirlit · Dagført __UPDATED__ · __COUNT__ ognir frá 5 meklarum</div></div>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#forsida" aria-label="Heim.fo, forsíða">
      <svg width="34" height="30" viewBox="0 0 34 30" aria-hidden="true"><path d="M2 15 17 3l15 12" fill="none" stroke="#D9661F" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M8 17v11h18V17" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/><rect x="14.5" y="20" width="5" height="8" fill="#D92128"/></svg>
      <span>Heim<b>.fo</b></span>
    </a>
    <nav class="main" aria-label="Høvuðsvalmynd">
      <a href="#forsida" data-nav="forsida">Forsíða</a>
      <a href="#ognir" data-nav="ognir">Allar ognir</a>
      <a href="#roknari" data-nav="roknari">Lánsroknari</a>
    </nav>
  </div>
</header>
<main id="app"></main>
<footer>
  <div class="wrap">
    <div><b>Heim.fo</b><br>HPH Designa</div>
    <div>Upplýsingar og myndir koma frá Meklarin, Betri Heim, Skyn, Skift og Ogn.fo.<br>Myndirnar verða vístar beinleiðis frá heimasíðum teirra.</div>
  </div>
</footer>
<script>
const AGENTS = {
  meklarin: {name:"Meklarin",  kind:"Meklari",   logo:"https://www.meklarin.fo/wp-content/themes/lunnar-meklarin/images/logo.svg", home:"https://www.meklarin.fo/"},
  betriheim:{name:"Betri Heim",kind:"Meklari",   logo:"https://www.betriheim.fo/images/logo.svg", home:"https://www.betriheim.fo/"},
  skyn:     {name:"Skyn",      kind:"Meklari",   logo:"https://www.skyn.fo/Files/Templates/Designs/Skyn2026/img/skyn-logo.svg", home:"https://www.skyn.fo/"},
  ogn:      {name:"Ogn.fo",    kind:"Advokatar", logo:"https://ogn.fo/site/templates/default/assets/images/logo.svg", home:"https://ogn.fo/"},
  skift:    {name:"Skift",     kind:"Meklari",   logo:"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjkgMTIgMjkyIDg4IiBmaWxsPSIjZGZiMDU5Ij48cGF0aCBkPSJtMTEuMiwzN3Y1OS44OGMwLC44Ny43MSwxLjU4LDEuNTgsMS41OGg2Ni4xN2MuODcsMCwxLjU4LS43MSwxLjU4LTEuNThzLS43MS0xLjU4LTEuNTgtMS41OEgxNC4zNnYtNTguM3MtLjQ5LTEtMS4zNi0xYy0xLDAtMS44LDEtMS44LDFaIi8+PHBhdGggZD0ibTM0LjA4LDczLjQ4bDMuNi04LjU0YzIuNzUsMS43MSw4LjA1LDMuNzIsMTEuNTMsMy43MiwyLjMyLDAsNC4yMS0uNzksNC4yMS0zLjU0LDAtMi41Ni0yLjU2LTMuNDItNi4xLTQuNTEtNS4xOC0xLjUyLTExLjcxLTQuMDMtMTEuNzEtMTIuMnM2LjI4LTEyLjc1LDE0LjctMTIuNzVjNS44LDAsMTEuMzUsMi4zOCwxNC45NSw2LjA0bC01LjQzLDYuODljLTMuMjMtMi4zOC02LjY1LTQuMTUtOS4zOS00LjE1LTIuMDcsMC0zLjkuODUtMy45LDMuMTEsMCwyLjYyLDIuODEsMy41NCw2LjU5LDQuNzYsNS41NSwxLjgzLDExLjUzLDQuMjEsMTEuNTMsMTIuMzhzLTYuNDEsMTIuOTktMTUuNSwxMi45OWMtNi4xLDAtMTIuNTEtMi40NC0xNS4wNy00LjIxWiIvPjxwYXRoIGQ9Im0xMDEuNzksMzYuMzl2MTUuOGguMTJsMTAuNDktMTUuOGgxMS40N2wtMTEuNTMsMTcuMTQsMTIuMjYsMjMuNDNoLTExLjgzbC03LjM4LTE1LjA3LTMuNiw1djEwLjA3aC0xMC40M3YtNDAuNTdoMTAuNDNaIi8+PHBhdGggZD0ibTE1OS45OSwzNi4zOXY0MC41N2gtMTAuNDl2LTQwLjU3aDEwLjQ5WiIvPjxwYXRoIGQ9Im0yMTYuNDcsMzYuMzl2OS4xNWgtMTcuNTF2Ni42NWgxNC41MnY5LjE1aC0xNC41MnYxNS42MmgtMTAuNDl2LTQwLjU3aDI4WiIvPjxwYXRoIGQ9Im0yNDAuMiw0NS41NHYtOS4xNWgzMi41MnY5LjE1aC0xMS4yMnYzMS40MmgtMTAuNDN2LTMxLjQyaC0xMC44NloiLz48cGF0aCBkPSJtMjk4LjY2LDc1Ljg0VjE1Ljk2YzAtLjg3LS43MS0xLjU4LTEuNTgtMS41OGgtNjYuMTdjLS44NywwLTEuNTguNzEtMS41OCwxLjU4cy43MSwxLjU4LDEuNTgsMS41OGg2NC41OXY1OC4zcy40OSwxLDEuMzYsMWMxLDAsMS44LTEsMS44LTFaIi8+PC9zdmc+", home:"https://www.skift.fo/"}
};
const L = __DATA__;
const TODAY = "__TODAY__";
const MON=["jan.","feb.","mars","apr.","mai","juni","juli","aug.","sept.","okt.","nov.","des."];
/* Nýtt síðan seinast: minnið liggur bert í hesum kaganum */
const VISIT=(()=>{let st=null;try{st=JSON.parse(localStorage.getItem("heimfo_visit")||"null")}catch(e){}
  const cur={date:TODAY,urls:L.map(o=>o.url),bids:Object.fromEntries(L.filter(o=>o.bid&&!o.expired).map(o=>[o.url,o.bid]))};
  let prev=null;
  if(st&&st.cur){prev=st.cur.date===TODAY?st.prev:st.cur}
  try{localStorage.setItem("heimfo_visit",JSON.stringify({cur,prev}))}catch(e){}
  return prev?{urls:new Set(prev.urls),bids:prev.bids||{},date:prev.date}:null;})();
const isNewSinceVisit=o=>!!VISIT&&!VISIT.urls.has(o.url)&&o.status!=="sold";
const isNewBidSinceVisit=o=>!!VISIT&&o.bid&&!o.expired&&o.status!=="sold"&&VISIT.urls.has(o.url)&&VISIT.bids[o.url]!==o.bid;
/* friskleiki: 0 = í dag/1 dag, 1 = 2–3 dagar, 2 = 4–7 dagar; meklarans "Nýggj ogn" brúkt, meðan søgan er ung */
const fresh=o=>{if(o.status==="sold")return -1;if(!o.seed&&o.days!=null){return o.days<=1?0:o.days<=3?1:o.days<=7?2:-1}return o.status==="new"?1:-1};
const newBid=o=>o.bidNewOn&&!o.bidSeed&&o.status!=="sold"&&(new Date(TODAY)-new Date(o.bidNewOn))/864e5<=2;
const dShort=iso=>{const d=new Date(iso+"T12:00:00");return `${d.getDate()}. ${MON[d.getMonth()]}`};
const AREAS = ["Norðoyggjar","Eysturoy","Norðstreymoy","Suðurstreymoy","Vágar","Sandoy","Suðuroy"];
const TYPES = [...new Set(L.map(o=>o.type))].sort((a,b)=>L.filter(o=>o.type===b).length-L.filter(o=>o.type===a).length);

const kr = n => "Kr. " + n.toLocaleString("da-DK");
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n.toLocaleString("da-DK");

function chips(o){
  const c=[];
  if(o.status==="new") c.push('<span class="chip new">Nýggj ogn</span>');
  if(o.status==="bid"&&!(isNewBidSinceVisit(o)||newBid(o))) c.push('<span class="chip bid">Boð</span>');
  if(o.status==="price") c.push('<span class="chip price">Nýggjur prísur</span>');
  if(o.status==="fixed") c.push('<span class="chip">Fastur prísur</span>');
  if(o.status==="sold") c.push('<span class="chip sold">Selt</span>');
  if(o.open) c.push('<span class="chip open">Opið hús</span>');
  if(isNewSinceVisit(o)) c.push('<span class="chip visit">Nýtt síðan seinast</span>');
  else if(!o.seed&&o.days===0) c.push('<span class="chip today">Nýtt í dag</span>');
  else if(!o.seed&&o.days<=7&&o.status!=="sold") c.push(`<span class="chip today soft">Nýtt · ${o.days} ${o.days===1?"dag":"dagar"} síðan</span>`);
  if(isNewBidSinceVisit(o)||newBid(o)) c.push('<span class="chip bidnew">Nýtt boð komið</span>');
  if(o.backOn) c.push('<span class="chip">Til sølu aftur</span>');
  if(o.priceChange<0&&o.status!=="price") c.push('<span class="chip price">Prísurin lækkaður</span>');
  return `<div class="chips">${c.join("")}</div>`;
}

function ageText(o){
  if(!o.firstSeen) return "";
  if(o.seed) return o.days>0?`Til sølu í minst ${o.days} ${o.days===1?"dag":"dagar"} (síðan ${dShort(o.firstSeen)} ella fyrr)`:`Til sølu síðan ${dShort(o.firstSeen)} ella fyrr`;
  if(o.days===0) return "Komið á marknaðin í dag";
  return `Til sølu í ${o.days} ${o.days===1?"dag":"dagar"} · síðan ${dShort(o.firstSeen)}`;
}
function card(o){
  const a=AGENTS[o.agent];
  const f=[];
  if(o.built) f.push(`<span>Byggiár <b>${esc(o.built)}</b></span>`);
  if(o.size) f.push(`<span><b>${fmt(o.size)}</b> m²</span>`);
  if(o.plot) f.push(`<span>Grund <b>${fmt(o.plot)}</b> m²</span>`);
  if(o.rooms) f.push(`<span><b>${esc(o.rooms)}</b> kømur</span>`);
  let line="";
  if(o.status==="bid"&&o.bid) line=`<div class="bidline num">Seinasta boð ${kr(o.bid)}${o.bidPrev?` <span class="was">(var ${kr(o.bidPrev)})</span>`:""}${o.bidText?` · ${esc(o.bidText)}`:""}</div>`;
  else if(o.expired&&o.bid) line=`<div class="bidline muted num">Útgingið boð ${kr(o.bid)}</div>`;
  if(o.open) line+=`<div class="bidline" style="color:var(--green-ink)">Opið hús ${esc(o.open)}</div>`;
  if(o.priceChange) line+=`<div class="bidline ${o.priceChange<0?"down":"up"} num">Prísurin ${o.priceChange<0?"lækkaður":"hækkaður"} ${fmt(Math.abs(o.priceChange))} kr. · frá ${kr(o.priceFirst)}</div>`;
  return `<a class="card${o.status==="sold"?" is-sold":""}${fresh(o)>=0?" fresh"+fresh(o):""}${isNewSinceVisit(o)?" fresh0":""}${(isNewBidSinceVisit(o)||newBid(o))?" hasbid":""}" href="${esc(o.url)}" target="_blank" rel="noopener" title="Opna ognina hjá ${esc(a.name)}">
    <div class="pic"><img src="${esc(o.img)}" alt="${esc(o.address)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"><span class="noimg">Mynd ikki tøk</span>${chips(o)}</div>
    <div class="body">
      <div class="addr">${esc(o.address)}</div>
      <div class="town">${o.zip?o.zip+" ":""}${esc(o.town||"Staður ikki upplýstur")} · ${esc(o.type)}</div>
      <div class="price num">${o.price?kr(o.price):'<span class="noprice">Prísur hjá meklaranum</span>'}${o.price&&o.size?`<span class="sqm">${fmt(Math.round(o.price/o.size))} kr./m²</span>`:""}</div>
      ${line}
      ${o.price&&o.status!=="sold"&&o.price>=200000?`<div class="monthly num">Lán: ca. ${fmt(Math.round(monthlyFor(o)))} kr. um mánaðin</div>`:""}
      <div class="age">${ageText(o)}</div>
      <div class="facts num">${f.join("")}</div>
    </div>
    <div class="src"><span class="srcl">Sí ognina hjá ${logo(o.agent)}</span><span class="ext" aria-hidden="true">↗</span></div>
  </a>`;
}

const state={q:"",area:"",type:"",max:"",rooms:"",agents:new Set(Object.keys(AGENTS)),sort:"fresh",sold:false,only:""};
function filtered(){
  const q=state.q.trim().toLowerCase();
  const r=L.filter(o=>
    state.agents.has(o.agent) &&
    (state.sold || o.status!=="sold") &&
    (!state.area||o.area===state.area) &&
    (!state.type||o.type===state.type) &&
    (!state.max||(o.price&&o.price<=+state.max)) &&
    (!state.rooms||(parseInt(o.rooms)||0)>=+state.rooms) &&
    (!q||`${o.address} ${o.town} ${o.zip||""}`.toLowerCase().includes(q)) &&
    (state.only!=="new"||isNewSinceVisit(o)) && (state.only!=="bids"||isNewBidSinceVisit(o)||newBid(o)));
  const s=SORTS[state.sort]||SORTS.fresh;
  return r.sort(s);
}
const pr=o=>o.status==="new"?0:o.status==="bid"||o.open?1:o.status==="price"?2:o.status==="sold"?9:3;
const SORTS={new:(a,b)=>pr(a)-pr(b)||a.rank-b.rank,low:(a,b)=>(a.price||9e9)-(b.price||9e9),high:(a,b)=>(b.price||0)-(a.price||0),age:(a,b)=>(b.days||0)-(a.days||0)||a.rank-b.rank,drop:(a,b)=>(a.priceChange||0)-(b.priceChange||0),fresh:(a,b)=>(isNewSinceVisit(b)-isNewSinceVisit(a))||((fresh(a)<0?9:fresh(a))-(fresh(b)<0?9:fresh(b)))||(a.days??999)-(b.days??999)||a.rank-b.rank,sqm:(a,b)=>(a.price&&a.size?a.price/a.size:9e9)-(b.price&&b.size?b.price/b.size:9e9),size:(a,b)=>(b.size||0)-(a.size||0)};
const opt=(arr,sel,all)=>`<option value="">${all}</option>`+arr.map(v=>`<option${v===sel?" selected":""}>${v}</option>`).join("");
const PRICES=[[500000,"500.000"],[1000000,"1 mió."],[2000000,"2 mió."],[3000000,"3 mió."],[4000000,"4 mió."],[5000000,"5 mió."],[7500000,"7,5 mió."]];
const priceOpt=sel=>`<option value="">Allir prísir</option>`+PRICES.map(([v,t])=>`<option value="${v}"${String(v)===String(sel)?" selected":""}>Upp í ${t}</option>`).join("");
const roomOpt=sel=>`<option value="">Øll</option>`+[1,2,3,4,5].map(n=>`<option value="${n}"${String(n)===String(sel)?" selected":""}>${n}+ kømur</option>`).join("");

const app=document.getElementById("app");
const logo=(k,cls="alogo")=>`<img class="${cls}" src="${AGENTS[k].logo}" alt="${esc(AGENTS[k].name)}" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('strong'),{textContent:this.alt}))">`;

/* Miðal m²-prísur: ognir við prísi og bústaðarvídd (minst 40 m²), ikki seldar, ikki grundøki/jørð */
const sqmBase=o=>o.status!=="sold"&&o.price&&o.size>=40&&!["Grundstykki","Jørð"].includes(o.type);
const avgSqm=arr=>{const b=arr.filter(sqmBase);return b.length?{avg:Math.round(b.reduce((s,o)=>s+o.price/o.size,0)/b.length),n:b.length}:null};
function areaStat(r){
  const here=avgSqm(r);
  const label=state.type?`${state.type} í ${state.area}`:state.area;
  if(!here) return `<div class="areastat"><div><span class="lbl">Miðal m²-prísur · ${esc(label)}</span><b>–</b><small>Ongar ognir við prísi og bústaðarvídd í hesum vali.</small></div></div>`;
  const all=avgSqm(L.filter(o=>!state.type||o.type===state.type));
  const diff=all?Math.round((here.avg/all.avg-1)*100):0;
  const cmp=all?`<div class="cmp ${diff>0?"up":diff<0?"down":""}"><b>${diff>0?"+":""}${diff} %</b><span>í mun til Føroyar sum heild<br>(${fmt(all.avg)} kr./m²)</span></div>`:"";
  return `<div class="areastat"><div><span class="lbl">Miðal m²-prísur · ${esc(label)}</span><b class="num">${fmt(here.avg)} kr./m²</b><small>Grundað á ${here.n} ${here.n===1?"ogn":"ognir"} við prísi og bústaðarvídd</small></div>${cmp}</div>`;
}

function viewHome(){
  const active=L.filter(o=>o.status!=="sold");
  const homes=active.filter(o=>o.price&&o.size>=40&&(o.type==="Sethús"||o.type==="Íbúð"));
  const avg=Math.round(homes.reduce((s,o)=>s+o.price/o.size,0)/homes.length);
  const newest=active.filter(o=>o.status==="new").sort((a,b)=>a.rank-b.rank);
  const live=active.filter(o=>o.status==="bid"||o.open||o.status==="price"||o.priceChange<0);
  const freshList=active.filter(o=>fresh(o)>=0||isNewSinceVisit(o)).sort(SORTS.fresh);
  const nNew=active.filter(isNewSinceVisit).length, nBid=active.filter(o=>isNewBidSinceVisit(o)||newBid(o)).length;
  const alertBar=(nNew||nBid)?`<div class="alerts">${nNew?`<button type="button" class="alert" data-only="new"><b>${nNew}</b> ${nNew===1?"nýggj ogn":"nýggjar ognir"} síðan tú vitjaði seinast →</button>`:""}${nBid?`<button type="button" class="alert bid" data-only="bids"><b>${nBid}</b> ${nBid===1?"nýtt boð":"nýggj boð"} →</button>`:""}</div>`:"";
  app.innerHTML=`
  <section class="hero">
    <svg class="stripes" viewBox="0 0 100 100" aria-hidden="true"><path d="M10 55 50 20l40 35" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round"/><path d="M22 58v32h56V58" fill="none" stroke="#fff" stroke-width="7"/></svg>
    <div class="wrap">
      <div class="kicker">Føroyski bústaðarmarknaðurin</div>
      <h1>Allar ognir. <span>Á einum staði.</span></h1>
      <p class="lead">Ognir til sølu frá Meklarin, Betri Heim, Skyn, Skift og Ogn.fo í einum yvirliti. Trýst á eina ogn, so fert tú beint til ognina hjá meklaranum.</p>
      <form class="search" id="hs">
        <div class="field"><label for="hq">Gøta, bygd ella postnr.</label><input id="hq" type="search" placeholder="t.d. Klaksvík ella Hoyvík" value="${esc(state.q)}"></div>
        <div class="field"><label for="ha">Øki</label><select id="ha">${opt(AREAS,state.area,"Øll øki")}</select></div>
        <div class="field"><label for="ht">Slag</label><select id="ht">${opt(TYPES,state.type,"Øll sløg")}</select></div>
        <div class="field"><label for="hm">Hægsti prísur</label><select id="hm">${priceOpt(state.max)}</select></div>
        <button class="btn" type="submit">Leita</button>
      </form>
      <div class="stats num">
        <div><b>${active.length}</b><span>ognir til sølu</span></div>
        <div><b>${Object.keys(AGENTS).length}</b><span>meklarar og advokatar</span></div>
        <div><b>${fmt(avg)}</b><span>miðal kr. pr. m² (hús og íbúðir)</span></div>
      </div>
    </div>
  </section>
  ${alertBar?`<div class="wrap">${alertBar}</div>`:""}
  ${freshList.length?`<section class="block"><div class="wrap">
    <div class="sec-head"><h2>Nýggjast</h2><a href="#ognir">Sí allar ognir →</a></div>
    <div class="grid featured">${freshList.slice(0,9).map(card).join("")}</div>
  </div></section>`:""}
  <section class="block"><div class="wrap">
    <div class="sec-head"><h2>Ognir frá</h2></div>
    <div class="agents">${Object.keys(AGENTS).map(k=>{const n=active.filter(o=>o.agent===k).length;return `<button type="button" class="agentcard" data-agent="${k}">${logo(k,"blogo")}<span class="num"><b>${n}</b> ognir til sølu</span><span class="go">Sí ognirnar →</span></button>`}).join("")}</div>
  </div></section>
  <section class="block"><div class="wrap">
    <div class="sec-head"><h2>Boð, opin hús og prísbroytingar</h2></div>
    <div class="grid">${live.map(card).join("")}</div>
  </div></section>`;
  document.querySelectorAll(".alert").forEach(b=>b.onclick=()=>{state.only=b.dataset.only;state.sort="fresh";location.hash="ognir"});
  document.querySelectorAll(".agentcard").forEach(b=>b.onclick=()=>{state.agents=new Set([b.dataset.agent]);location.hash="ognir"});
  document.getElementById("hs").addEventListener("submit",e=>{
    e.preventDefault();
    state.q=hq.value;state.area=ha.value;state.type=ht.value;state.max=hm.value;
    location.hash="ognir";
  });
}

function viewList(){
  const counts={};L.forEach(o=>{if(state.sold||o.status!=="sold")counts[o.agent]=(counts[o.agent]||0)+1});
  app.innerHTML=`
  <div class="wrap page-head"><h1>Allar ognir</h1><p>Øll kortini leinkja beint til ognina hjá meklaranum, har tú finnur myndir, lýsing og boðgeving.</p></div>
  <div class="wrap listing">
    <form class="filters" id="ff" aria-label="Filtur">
      <h3>Filtur</h3>
      <div class="field"><label for="fq">Gøta, bygd ella postnr.</label><input id="fq" type="search" value="${esc(state.q)}"></div>
      <div class="field"><label for="fa">Øki</label><select id="fa">${opt(AREAS,state.area,"Øll øki")}</select></div>
      <div class="field"><label for="ft">Slag</label><select id="ft">${opt(TYPES,state.type,"Øll sløg")}</select></div>
      <div class="field"><label for="fm">Hægsti prísur</label><select id="fm">${priceOpt(state.max)}</select></div>
      <div class="field"><label for="fr">Kømur</label><select id="fr">${roomOpt(state.rooms)}</select></div>
      <div class="field"><label>Meklari</label>
        <div class="agentlist">${Object.entries(AGENTS).map(([k,a])=>`<label><input type="checkbox" id="ag-${k}" value="${k}"${state.agents.has(k)?" checked":""}> ${logo(k,"flogo")}<span class="cnt num">${counts[k]||0}</span></label>`).join("")}</div>
      </div>
      <div class="agentlist"><label><input type="checkbox" id="fs"${state.sold?" checked":""}> Vís eisini seldar ognir</label></div>
      <button type="button" class="linkbtn" id="fx">Tak filtur burtur</button>
    </form>
    <div style="min-width:0">
      <div class="results-bar">
        <div class="count num" id="cnt"></div>
        <div class="field"><label for="so">Raða eftir</label>
          <select id="so">
            <option value="fresh"${state.sort==="fresh"?" selected":""}>Nýggjast fyrst</option>
            <option value="low"${state.sort==="low"?" selected":""}>Lægsti prísur</option>
            <option value="high"${state.sort==="high"?" selected":""}>Hægsti prísur</option>
            <option value="age"${state.sort==="age"?" selected":""}>Longst á marknaðinum</option>
            <option value="drop"${state.sort==="drop"?" selected":""}>Størsta prísfall</option>
            <option value="sqm"${state.sort==="sqm"?" selected":""}>Lægsti m²-prísur</option>
            <option value="size"${state.sort==="size"?" selected":""}>Størsta vídd</option>
          </select></div>
      </div>
      <p class="loanhint">Lánið á kortunum er roknað við ${calc.ownPct} % eginfígging og ${calc.years} ára lánstíð. <a href="#roknari">Broyt í lánsroknaranum</a></p>
      <div id="areastat"></div>
      <div id="res"></div>
    </div>
  </div>`;
  const draw=()=>{
    const r=filtered();
    cnt.innerHTML=`${r.length} ${r.length===1?"ogn":"ognir"}${state.only?` · ${state.only==="new"?"nýggjar síðan seinast":"nýggj boð"} <button type="button" class="linkbtn" id="clronly">Vís allar</button>`:""}`;
    const co=document.getElementById("clronly"); if(co) co.onclick=()=>{state.only="";draw()};
    areastat.innerHTML=state.area?areaStat(r):"";
    res.innerHTML=r.length?`<div class="grid">${r.map(card).join("")}</div>`:
      `<div class="empty">Ongar ognir at vísa við hesum vali.<br><button class="linkbtn" id="fx2" type="button">Tak filtur burtur</button></div>`;
    const fx2=document.getElementById("fx2"); if(fx2) fx2.onclick=reset;
  };
  const read=()=>{
    state.q=fq.value;state.area=fa.value;state.type=ft.value;state.max=fm.value;state.rooms=fr.value;state.sold=fs.checked;state.sort=so.value;
    state.agents=new Set([...document.querySelectorAll('.agentlist input[id^="ag-"]')].filter(i=>i.checked).map(i=>i.value));
    draw();
  };
  const reset=()=>{Object.assign(state,{q:"",area:"",type:"",max:"",rooms:"",sold:false,only:"",agents:new Set(Object.keys(AGENTS))});viewList();};
  ff.addEventListener("input",read);ff.addEventListener("change",read);ff.addEventListener("submit",e=>e.preventDefault());
  so.addEventListener("change",read);fx.onclick=reset;
  draw();
}


/* ---------- Lánsroknari (vegleiðandi) ---------- */
const LOANS={vanligt:{name:"Bústaðarlán",rate:4.65},orku:{name:"Bústaðarlán til varandi orkuskipan",rate:4.45}};
const SUBSIDY=0.35;
const calc={loan:"vanligt",ownPct:10,years:30,price:3500000};
function loanCalc(price,own,years,rate){
  const P=Math.max(0,price-own), n=years*12, r=rate/100/12;
  if(!P) return {P:0,gross:0,net:0,interest:0,subsidy:0,total:0};
  const gross=r?P*r/(1-Math.pow(1+r,-n)):P/n, interest=gross*n-P, subsidy=interest*SUBSIDY;
  return {P,gross,net:(gross*n-subsidy)/n,interest,subsidy,total:gross*n-subsidy};
}
const monthlyFor=o=>loanCalc(o.price,o.price*calc.ownPct/100,calc.years,LOANS[calc.loan].rate).net;

function viewCalc(){
  app.innerHTML=`
  <div class="wrap page-head"><h1>Lánsroknari</h1><p>Rokna út, hvat eitt bústaðarlán kostar um mánaðin. Eginfíggingin og lánstíðin, tú velur her, verða eisini nýtt á kortunum við ognunum.</p></div>
  <div class="wrap calc">
    <form class="filters calcform" id="cf" aria-label="Lánsroknari">
      <div class="field"><label for="cl">Slag av láni</label><select id="cl">${Object.entries(LOANS).map(([k,v])=>`<option value="${k}"${calc.loan===k?" selected":""}>${v.name} (${String(v.rate).replace(".",",")} %)</option>`).join("")}</select></div>
      <div class="field"><label for="cp">Hvat kostar ognin?</label><div class="unit"><input id="cp" inputmode="numeric" value="${fmt(calc.price)}"><span>kr.</span></div></div>
      <div class="field"><label for="co">Eginfígging</label><div class="unit"><input id="co" inputmode="numeric" value="${fmt(Math.round(calc.price*calc.ownPct/100))}"><span>kr.</span></div><input id="cor" type="range" min="0" max="50" step="1" value="${calc.ownPct}" aria-label="Eginfígging í prosent"><small id="cot"></small></div>
      <div class="field"><label for="cy">Lánstíðarskeið</label><input id="cy" type="range" min="5" max="40" step="1" value="${calc.years}"><small id="cyt"></small></div>
    </form>
    <div class="calcout" id="out" aria-live="polite"></div>
  </div>`;
  const num=v=>+String(v).replace(/[^\d]/g,"")||0;
  const draw=()=>{
    const own=calc.price*calc.ownPct/100, rate=LOANS[calc.loan].rate, c=loanCalc(calc.price,own,calc.years,rate);
    cot.textContent=`${calc.ownPct} % av prísinum`; cyt.textContent=`${calc.years} ár`;
    const ltv=calc.price?c.P/calc.price*100:0;
    out.innerHTML=`
      <div class="pricebox">
        <div class="lbl">Mett mánaðarligt gjald, íroknað rentustuðul</div>
        <div class="big num">${fmt(Math.round(c.net))} kr.</div>
        <div class="sub num">Uttan rentustuðul: ${fmt(Math.round(c.gross))} kr. · Rentan er ${String(rate).replace(".",",")} %</div>
      </div>
      <dl class="rows num">
        <div><dt>Lánsupphædd</dt><dd>${fmt(Math.round(c.P))} kr.</dd></div>
        <div><dt>Rentuútreiðslur tilsamans</dt><dd>${fmt(Math.round(c.interest))} kr.</dd></div>
        <div><dt>Rentustuðul (35 %)</dt><dd>− ${fmt(Math.round(c.subsidy))} kr.</dd></div>
        <div class="tot"><dt>Samlað afturgjald</dt><dd>${fmt(Math.round(c.total))} kr.</dd></div>
      </dl>
      ${ltv>80?`<p class="warn">Lánið er ${Math.round(ltv)} % av prísinum. Bankarnir lána vanliga í mesta lagi 80 % av virðinum, so restin krevur aðra fígging.</p>`:""}`;
  };
  cp.addEventListener("input",()=>{calc.price=num(cp.value);co.value=fmt(Math.round(calc.price*calc.ownPct/100));draw()});
  cp.addEventListener("blur",()=>cp.value=fmt(calc.price));
  co.addEventListener("input",()=>{const v=num(co.value);calc.ownPct=calc.price?Math.min(100,Math.round(v/calc.price*1000)/10):0;cor.value=calc.ownPct;draw()});
  co.addEventListener("blur",()=>co.value=fmt(num(co.value)));
  cor.addEventListener("input",()=>{calc.ownPct=+cor.value;co.value=fmt(Math.round(calc.price*calc.ownPct/100));draw()});
  cy.addEventListener("input",()=>{calc.years=+cy.value;draw()});
  cl.addEventListener("change",()=>{calc.loan=cl.value;draw()});
  cf.addEventListener("submit",e=>e.preventDefault());
  draw();
}

function route(){
  const h=location.hash.replace("#","")||"forsida";
  document.querySelectorAll("nav.main a").forEach(a=>{if(a.dataset.nav===h)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(h==="ognir") viewList(); else if(h==="roknari") viewCalc(); else viewHome();
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);
route();

</script>
